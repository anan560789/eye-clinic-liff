<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- ========================================== -->
    <!-- LINE 與社群分享預覽設定 (Open Graph Tags)  -->
    <!-- ========================================== -->
    
    <!-- 網頁標籤頁顯示的標題 -->
    <title>👁️ 彥臣數位眼科復健中心</title>
    <!-- 網頁的基本描述 -->
    <meta name="description" content="專為上班族、學生、會計師及3C重度用眼者設計">
    
    <!-- LINE / FB 分享時顯示的標題 -->
    <meta property="og:title" content="👁️ 彥臣數位眼科復健中心">
    <!-- LINE / FB 分享時顯示的描述 -->
    <meta property="og:description" content="專為上班族、學生、會計師及3C重度用眼者設計">
    <meta property="og:type" content="website">
    <!-- LINE / FB 分享時顯示的圖片 (預設使用一張高畫質的眼睛/科技意象圖，若要換成自己的圖，可將圖片放進 public 並將這裡改成網址) -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1512591290618-904e04936827?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
    
    <!-- ========================================== -->

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
